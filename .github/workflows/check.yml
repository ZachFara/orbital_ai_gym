name: check

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install the project with every extra
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev,train,render]"
      - name: make check
        run: make check

  commits:
    name: commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conventional commit messages on this PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python tools/check_commit_msg.py --range "origin/${BASE_REF}..HEAD"
